services:
  babyshower:
    # Pre-built image published by .github/workflows/docker.yml on every push.
    # If the package is private on GitHub, run `docker login ghcr.io` on the server first (see README).
    image: ghcr.io/kcb064/babyshower:latest
    pull_policy: always
    # To build locally instead, comment out `image` + `pull_policy` and uncomment:
    # build: .
    container_name: babyshower
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_PATH: /data/registry.db
    volumes:
      # Everything the app stores (database, uploads, backups, image cache) lives in ./data next to
      # this file, so `docker compose pull && docker compose up -d` (or `down`, even `down -v`) never
      # touches it. Back it up by copying the folder. Permissions are fixed by the container itself.
      # Moving from the earlier named volume? See "Updating without losing data" in the README.
      - ./data:/data
    # Nothing is published to the host by default; the Cloudflare Tunnel reaches the container.
    # Uncomment to reach it directly on the host (e.g. if cloudflared runs on the host, not in Docker):
    # ports:
    #   - "3000:3000"
    #
    # Routing your existing cloudflared tunnel:
    #  - cloudflared in Docker: put it on the same network (see `networks` below, or attach it with
    #    `docker network connect babyshower_default <cloudflared-container>`), then add a public
    #    hostname in the tunnel config pointing at  http://babyshower:3000
    #  - cloudflared on the host: uncomment `ports` above and point the hostname at
    #    http://<host-ip>:3000  (or http://localhost:3000)
    # networks:
    #   - cloudflared

# If your cloudflared container lives on an existing external network, declare it here
# and uncomment `networks` on the service above:
# networks:
#   cloudflared:
#     external: true
