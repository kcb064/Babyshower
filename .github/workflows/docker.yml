name: Docker image

on:
  push:
    branches: [ccr-161763d9-uprse4, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/babyshower

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Add linux/arm64 here if your Docker host is ARM (Raspberry Pi, Apple Silicon VM).
          # The native SQLite module then compiles under emulation, which adds several minutes.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e EDITOR_PASSCODE=ci -e COOKIE_SECRET=0123456789abcdef0123456789abcdef \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "container never became healthy"; docker logs smoke; exit 1
